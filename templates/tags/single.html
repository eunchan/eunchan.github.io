{% extends "base.html" %}

{% block content %}
<div class="taxonomy-single">
  <h1>#{{ term.name }}</h1>
  <ul class="post-list">
    {% for page in term.pages %}
    <li class="post-item">
      <a href="{{ page.permalink }}">{{ page.title }}</a>
      {% if page.date %}
      <span class="post-item-date">{{ page.date | date(format="%Y-%m-%d") }}</span>
      {% endif %}
    </li>
    {% endfor %}
  </ul>
</div>
{% endblock content %}
